<!-- ========================================== -->
<!-- VIEW 1: INVENTORY (คลังพัสดุคงคลัง) -->
<!-- ========================================== -->
<main id="viewInventory" class="flex-1 overflow-y-auto p-4 lg:p-6 hidden flex-col gap-4">
    <!-- Search & Progressive Disclosure Filter Bar -->
    <div class="bg-white rounded-2xl border border-slate-200/90 p-4 flex flex-col gap-3">
        <!-- Top Row: Search (Primary Default) + Action Controls ("ตัวกรอง ▾", Restock, Export) -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
            <!-- Primary Search Bar -->
            <div class="relative flex-1">
                <i class="ph ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none"></i>
                <input type="text" id="invSearchInput" oninput="onInvSearchInput(this.value)" aria-label="ค้นหาชื่อพัสดุ รหัส หมวดหมู่ หรือสถานที่จัดเก็บ" placeholder="ค้นหาชื่อพัสดุ, รหัสพัสดุ, หมวดหมู่, หรือสถานที่จัดเก็บ... (Ctrl+K)" class="w-full pl-9 pr-8 py-2 text-xs sm:text-sm bg-slate-50 hover:bg-slate-100/80 focus:bg-white border border-slate-200 focus:border-blue-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-100 transition text-slate-800 placeholder:text-slate-400 font-normal">
                <button type="button" onclick="clearSearch()" id="invClearSearchBtn" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 hidden text-xs leading-none p-1.5 rounded-full hover:bg-slate-200 transition" aria-label="ล้างการค้นหา" title="ล้างการค้นหา">
                    <i class="ph-bold ph-x"></i>
                </button>
            </div>

            <!-- Actions & Controls -->
            <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap flex-shrink-0">
                <!-- Progressive Disclosure Filter Toggle Button ("ตัวกรอง ▾") -->
                <button type="button" onclick="toggleFilterAccordion()" id="btnFilterToggle" aria-expanded="false" aria-controls="filterAccordion" class="px-3.5 py-2 min-h-[40px] rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-semibold flex items-center justify-center gap-1.5 transition cursor-pointer" title="คลิกเพื่อเปิด/ปิด ตัวกรอง" aria-label="เปิดหรือปิดแถบตัวกรอง">
                    <i class="ph-bold ph-faders text-slate-600"></i>
                    <span id="filterBtnLabel">ตัวกรอง</span>
                    <span id="activeFilterCountBadge" class="hidden px-1.5 py-0.2 bg-blue-600 text-white rounded-full text-[10px] font-bold font-num leading-tight">0</span>
                    <i class="ph ph-caret-down text-[11px] transition-transform duration-200 text-slate-500" id="filterCaret"></i>
                </button>

                <!-- Action: Restock button (Restricted: Admin/Officer only) -->
                <button type="button" id="btnRestockAction" onclick="openAddStockModal()" aria-label="รับเข้าพัสดุใหม่" class="inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-4 py-2 min-h-[40px] rounded-lg text-xs font-semibold transition cursor-pointer">
                    <i class="ph-bold ph-plus text-xs"></i>
                    <span class="hidden sm:inline">รับเข้าพัสดุ</span>
                    <span class="sm:hidden">รับเข้า</span>
                </button>

                <!-- CSV Export Button -->
                <button type="button" onclick="exportToCSV()" aria-label="ส่งออกข้อมูลพัสดุทั้งหมดเป็นไฟล์ CSV" class="px-3 py-2 min-h-[40px] rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-semibold flex items-center justify-center gap-1.5 transition cursor-pointer" title="ส่งออกข้อมูลเป็น CSV">
                    <i class="ph ph-download-simple text-blue-600"></i>
                    <span class="hidden md:inline">ส่งออก CSV</span>
                    <span class="md:hidden">CSV</span>
                </button>
            </div>
        </div>

        <!-- Active Filter Chips Row (Visible only when filters are active) -->
        <div id="activeFilterChipsContainer" class="hidden pt-2 border-t border-slate-100 flex items-center justify-between gap-2 flex-wrap text-xs">
            <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-slate-400 text-[11px] font-medium flex items-center gap-1">
                    <i class="ph ph-funnel text-blue-600 text-xs"></i>
                    <span>ตัวกรองที่เลือก:</span>
                </span>
                <div id="activeFilterChipsList" class="flex items-center gap-1.5 flex-wrap">
                    <!-- Populated dynamically by renderActiveFilterChips() -->
                </div>
            </div>

            <!-- Reset All Filters Button -->
            <button type="button" onclick="resetFilters()" class="text-xs text-rose-600 hover:text-rose-800 font-semibold inline-flex items-center gap-1 px-2.5 py-1 rounded-lg hover:bg-rose-50 transition ml-auto cursor-pointer" title="ล้างตัวกรองทั้งหมด" aria-label="ล้างตัวกรองทั้งหมด">
                <i class="ph-bold ph-arrow-counter-clockwise text-xs"></i>
                <span>ล้างตัวกรอง</span>
            </button>
        </div>

        <!-- Collapsible Filter Panel (Hidden by default under "ตัวกรอง ▾") -->
        <div id="filterAccordion" class="hidden pt-3 border-t border-slate-100 flex flex-col gap-3 text-xs bg-slate-50 p-4 rounded-xl mt-1">
            <!-- Row 1: Status Filter Pills (Semantic Dots & Badges) -->
            <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                <span class="text-slate-500 font-semibold text-[11px] min-w-[75px]">สถานะ:</span>
                <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5 text-xs" id="statusFilterPillsContainer" role="group" aria-label="กรองตามสถานะพัสดุ">
                    <button type="button" onclick="setQuickStatusFilter('')" id="pillStatusAll" class="filter-pill active">
                        <span>ทั้งหมด</span>
                        <span class="filter-count-badge font-num" id="filterBadgeAll">100</span>
                    </button>
                    <button type="button" onclick="setQuickStatusFilter('normal')" id="pillStatusNormal" class="filter-pill">
                        <i class="ph-bold ph-check-circle text-emerald-600 text-xs" aria-hidden="true"></i>
                        <span>ปกติ (พร้อมใช้)</span>
                        <span class="filter-count-badge font-num" id="filterBadgeNormal">85</span>
                    </button>
                    <button type="button" onclick="setQuickStatusFilter('low')" id="pillStatusLow" class="filter-pill">
                        <i class="ph-bold ph-warning text-amber-600 text-xs" aria-hidden="true"></i>
                        <span>เฝ้าระวัง (ใกล้ขั้นต่ำ)</span>
                        <span class="filter-count-badge font-num" id="filterBadgeLow">10</span>
                    </button>
                    <button type="button" onclick="setQuickStatusFilter('critical')" id="pillStatusCritical" class="filter-pill">
                        <i class="ph-bold ph-warning-octagon text-rose-600 text-xs" aria-hidden="true"></i>
                        <span>วิกฤต (ต่ำกว่าขั้นต่ำ)</span>
                        <span class="filter-count-badge font-num" id="filterBadgeCritical">5</span>
                    </button>
                </div>
            </div>

            <!-- Row 2: Category Subtabs Bar (8 Neutral Badges) -->
            <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                <span class="text-slate-500 font-semibold text-[11px] min-w-[75px]">กลุ่มหมวดหมู่:</span>
                <div class="flex items-center gap-1 overflow-x-auto text-xs pb-0.5" id="categorySubtabsBar">
                    <button type="button" onclick="setCategorySubtab('')" class="tab-l2 active" data-category="">
                        ทุกหมวด
                    </button>
                    <button type="button" onclick="setCategorySubtab('วัสดุสำนักงาน')" class="tab-l2" data-category="วัสดุสำนักงาน">
                        วัสดุสำนักงาน
                    </button>
                    <button type="button" onclick="setCategorySubtab('วัสดุการศึกษา')" class="tab-l2" data-category="วัสดุการศึกษา">
                        วัสดุการศึกษา
                    </button>
                    <button type="button" onclick="setCategorySubtab('วัสดุคอมพิวเตอร์')" class="tab-l2" data-category="วัสดุคอมพิวเตอร์">
                        วัสดุคอมพิวเตอร์
                    </button>
                    <button type="button" onclick="setCategorySubtab('วัสดุกีฬา')" class="tab-l2" data-category="วัสดุกีฬา">
                        วัสดุกีฬา
                    </button>
                    <button type="button" onclick="setCategorySubtab('วัสดุงานบ้านงานครัว')" class="tab-l2" data-category="วัสดุงานบ้านงานครัว">
                        วัสดุงานบ้านงานครัว
                    </button>
                    <button type="button" onclick="setCategorySubtab('วัสดุวิทยาศาสตร์หรือการแพทย์')" class="tab-l2" data-category="วัสดุวิทยาศาสตร์หรือการแพทย์">
                        วัสดุวิทย์/การแพทย์
                    </button>
                    <button type="button" onclick="setCategorySubtab('วัสดุไฟฟ้าและวิทยุ')" class="tab-l2" data-category="วัสดุไฟฟ้าและวิทยุ">
                        วัสดุไฟฟ้าและวิทยุ
                    </button>
                    <button type="button" onclick="setCategorySubtab('วัสดุก่อสร้าง')" class="tab-l2" data-category="วัสดุก่อสร้าง">
                        วัสดุก่อสร้าง
                    </button>
                </div>
            </div>

            <!-- Row 3: Dropdowns for Location & Granular Filtering -->
            <div class="flex flex-wrap items-center gap-3 pt-2 border-t border-slate-200/60">
                <div class="flex items-center gap-1.5">
                    <label for="filterWarehouse" class="text-slate-500 text-[11px] font-medium">สถานที่จัดเก็บ/คลัง:</label>
                    <select id="filterWarehouse" aria-label="กรองตามสถานที่จัดเก็บหรือคลัง" title="กรองตามสถานที่จัดเก็บหรือคลัง" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs bg-white focus:outline-none focus:border-blue-500">
                        <option value="">ทุกสถานที่จัดเก็บ</option>
                    </select>
                </div>

                <div class="flex items-center gap-1.5">
                    <label for="filterCategory" class="text-slate-500 text-[11px] font-medium">หมวดหมู่:</label>
                    <select id="filterCategory" aria-label="กรองตามหมวดหมู่พัสดุ" title="กรองตามหมวดหมู่พัสดุ" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs bg-white focus:outline-none focus:border-blue-500">
                        <option value="">ทั้งหมด (8 หมวด)</option>
                    </select>
                </div>

                <div class="flex items-center gap-1.5">
                    <label for="filterStatus" class="text-slate-500 text-[11px] font-medium">สถานะ:</label>
                    <select id="filterStatus" aria-label="กรองตามสถานะพัสดุ" title="กรองตามสถานะพัสดุ" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs bg-white focus:outline-none focus:border-blue-500">
                        <option value="">ทุกสถานะ</option>
                        <option value="normal">ปกติ (เพียงพอ)</option>
                        <option value="low">ต่ำ (ใกล้หมด)</option>
                        <option value="critical">วิกฤต (ต้องสั่งซื้อ)</option>
                    </select>
                </div>

                <button type="button" onclick="resetFilters()" class="text-xs text-rose-600 hover:text-rose-800 font-semibold inline-flex items-center gap-1 ml-auto hover:underline cursor-pointer">
                    <i class="ph-bold ph-arrow-counter-clockwise text-xs"></i>
                    <span>ล้างตัวกรอง</span>
                </button>
            </div>
        </div>
    </div>

    <!-- STREAMLINED INVENTORY TABLE (Level 1: Essential columns only) -->
    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col">
        <!-- Desktop / Tablet Table View (hidden on mobile) -->
        <div class="hidden md:block overflow-x-auto">
            <table class="w-full text-left border-collapse text-table-cell">
                <thead>
                    <tr class="bg-slate-50/80 border-b border-slate-200 text-slate-600 font-semibold text-table-header">
                        <th class="py-2.5 px-4 cursor-pointer hover:text-blue-600 text-sm font-semibold" onclick="handleSort('code')">
                            <div class="flex items-center gap-1">
                                <span>รหัสพัสดุ</span>
                                <i class="ph ph-caret-up-down text-[10px]"></i>
                            </div>
                        </th>
                        <th class="py-2.5 px-4 cursor-pointer hover:text-blue-600 text-sm font-semibold" onclick="handleSort('name')">
                            <div class="flex items-center gap-1">
                                <span>รายการพัสดุ & หมวดหมู่</span>
                                <i class="ph ph-caret-up-down text-[10px]"></i>
                            </div>
                        </th>
                        <th class="py-2.5 px-4 text-right cursor-pointer hover:text-blue-600 text-sm font-semibold" onclick="handleSort('stock')">
                            <div class="flex items-center justify-end gap-1">
                                <span>ยอดคงเหลือ</span>
                                <i class="ph ph-caret-up-down text-[10px]"></i>
                            </div>
                        </th>
                        <th class="py-2.5 px-4 text-center text-sm font-semibold">สถานะ</th>
                        <th class="py-2.5 px-4 hidden lg:table-cell text-sm font-semibold">สถานที่จัดเก็บ</th>
                        <th class="py-2.5 px-4 text-right text-sm font-semibold">ดำเนินการ</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody" class="divide-y divide-slate-100 text-table-cell">
                    <!-- Injected by JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Mobile Compact Card / List View (visible on < md, NO horizontal scroll) -->
        <div id="inventoryMobileList" class="md:hidden flex flex-col gap-2.5 p-3">
            <!-- Injected by JavaScript renderTable() -->
        </div>

        <!-- Empty State (Req 23) -->
        <div id="tableEmptyState" role="status" aria-live="polite" class="hidden py-12 text-center text-slate-400">
            <div class="w-14 h-14 mx-auto mb-3 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                <i class="ph ph-magnifying-glass text-2xl text-slate-400" aria-hidden="true"></i>
            </div>
            <p class="font-bold text-slate-700 text-sm">ไม่พบรายการพัสดุที่ตรงกับเงื่อนไขการค้นหา</p>
            <p class="text-xs text-slate-400 mt-1 max-w-sm mx-auto">ลองเปลี่ยนคำค้นหา ปรับหมวดหมู่ หรือกดปุ่มด้านล่างเพื่อแสดงพัสดุทั้งหมด</p>
            <div class="mt-4 flex items-center justify-center gap-2">
                <button type="button" onclick="resetFilters()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold shadow-sm hover:shadow transition flex items-center gap-1.5 cursor-pointer active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1" aria-label="ล้างตัวกรองทั้งหมด">
                    <i class="ph ph-arrow-counter-clockwise"></i>
                    <span>ล้างตัวกรองทั้งหมด</span>
                </button>
            </div>
        </div>

        <!-- Pagination Footer -->
        <div class="px-4 py-2 border-t border-slate-100 bg-slate-50/50 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
            <div class="flex items-center gap-2">
                <label for="itemsPerPage">แสดง</label>
                <select id="itemsPerPage" aria-label="จำนวนรายการที่แสดงต่อหน้า" title="จำนวนรายการที่แสดงต่อหน้า" class="border border-slate-200 rounded px-1.5 py-0.5 bg-white font-num text-xs">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <span id="paginationInfo" class="font-num">รายการ</span>
            </div>
            <div class="flex items-center gap-1 font-num" id="paginationControls"></div>
        </div>
    </div>
</main>
