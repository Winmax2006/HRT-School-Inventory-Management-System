<!-- STREAMLINED INVENTORY TABLE COMPONENT -->
<div class="bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col">
    <!-- Desktop / Tablet Table View (hidden on mobile) -->
    <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-left border-collapse text-table-cell">
            <thead>
                <tr class="bg-slate-50/80 border-b border-slate-200 text-slate-600 font-semibold text-table-header">
                    <th class="py-2.5 px-4 cursor-pointer hover:text-blue-600 text-sm font-semibold" onclick="handleSort('code')">
                        <div class="flex items-center gap-1">
                            <span>รหัสพัสดุ</span>
                            <i class="ph ph-caret-up-down text-[10px]"></i>
                        </div>
                    </th>
                    <th class="py-2.5 px-4 cursor-pointer hover:text-blue-600 text-sm font-semibold" onclick="handleSort('name')">
                        <div class="flex items-center gap-1">
                            <span>รายการพัสดุ & หมวดหมู่</span>
                            <i class="ph ph-caret-up-down text-[10px]"></i>
                        </div>
                    </th>
                    <th class="py-2.5 px-4 text-right cursor-pointer hover:text-blue-600 text-sm font-semibold" onclick="handleSort('stock')">
                        <div class="flex items-center justify-end gap-1">
                            <span>ยอดคงเหลือ</span>
                            <i class="ph ph-caret-up-down text-[10px]"></i>
                        </div>
                    </th>
                    <th class="py-2.5 px-4 text-center text-sm font-semibold">สถานะ</th>
                    <th class="py-2.5 px-4 hidden lg:table-cell text-sm font-semibold">สถานที่จัดเก็บ</th>
                    <th class="py-2.5 px-4 text-right text-sm font-semibold">ดำเนินการ</th>
                </tr>
            </thead>
            <tbody id="inventoryTableBody" class="divide-y divide-slate-100 text-table-cell">
                <!-- Injected dynamically by renderTable() -->
            </tbody>
        </table>
    </div>

    <!-- Mobile Compact Card / List View (visible on < md, NO horizontal scroll) -->
    <div id="inventoryMobileList" class="md:hidden flex flex-col gap-2.5 p-3">
        <!-- Injected dynamically by renderTable() -->
    </div>

    <!-- Empty State -->
    <div id="tableEmptyState" role="status" aria-live="polite" class="hidden py-12 text-center text-slate-400">
        <div class="w-14 h-14 mx-auto mb-3 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
            <i class="ph ph-magnifying-glass text-2xl text-slate-400" aria-hidden="true"></i>
        </div>
        <p class="font-bold text-slate-700 text-sm">ไม่พบรายการพัสดุที่ตรงกับเงื่อนไขการค้นหา</p>
        <p class="text-xs text-slate-400 mt-1 max-w-sm mx-auto">ลองเปลี่ยนคำค้นหา ปรับหมวดหมู่ หรือกดปุ่มด้านล่างเพื่อแสดงพัสดุทั้งหมด</p>
        <div class="mt-4 flex items-center justify-center gap-2">
            <button type="button" onclick="resetFilters()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold shadow-sm hover:shadow transition flex items-center gap-1.5 cursor-pointer active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1" aria-label="ล้างตัวกรองทั้งหมด">
                <i class="ph ph-arrow-counter-clockwise"></i>
                <span>ล้างตัวกรองทั้งหมด</span>
            </button>
        </div>
    </div>

    <!-- Pagination Footer -->
    <div class="px-4 py-2 border-t border-slate-100 bg-slate-50/50 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
        <div class="flex items-center gap-2">
            <label for="itemsPerPage">แสดง</label>
            <select id="itemsPerPage" aria-label="จำนวนรายการที่แสดงต่อหน้า" title="จำนวนรายการที่แสดงต่อหน้า" class="border border-slate-200 rounded px-1.5 py-0.5 bg-white font-num text-xs">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <span id="paginationInfo" class="font-num">รายการ</span>
        </div>
        <div class="flex items-center gap-1 font-num" id="paginationControls"></div>
    </div>
</div>
