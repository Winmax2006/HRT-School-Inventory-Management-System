<script>
// ============================================================================
// HRT MINI REQUISITION WEB APP (PRODUCTION CANONICAL CLIENT)
// Shared Backend: Config.gs, Api.gs, Read.gs, Write.gs, Audit.gs
// Institutional SSOT: 16 Canonical Sheets
// ============================================================================

// 1. Icon Library
const paths = {box:'<path d="m12 3 9 5v8l-9 5-9-5V8l9-5Z"/><path d="m3 8 9 5 9-5M12 13v8M7.5 5.5l9 5"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',cart:'<path d="M2 3h3l3 12h11l3-9H6M9 19h.01M18 19h.01"/><circle cx="9" cy="19" r="1"/><circle cx="18" cy="19" r="1"/>',list:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v4H9zM9 12h6M9 16h6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',scan:'<path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5M6 12h12"/><path d="M7 7h3v3H7zM14 7h3v3h-3zM7 15h3v3H7zM14 14h3v4h-3z"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',check:'<path d="m5 12 4 4L20 5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',paper:'<rect x="6" y="4" width="13" height="17" rx="1"/><path d="M3 17V2h13M9 9h7M9 13h7M9 17h5"/>',pen:'<path d="m5 15 11-11 4 4L9 19l-5 1 1-5ZM14 6l4 4"/>',clip:'<path d="m8 8 7-5a4 4 0 0 1 5 6L9 20a5 5 0 0 1-7-7L13 2M6 14l8-8"/>',bottle:'<path d="M9 3h6v4l3 4v9H6v-9l3-4V3ZM8 14h8M10 1h4"/>',tape:'<circle cx="10" cy="10" r="8"/><circle cx="10" cy="10" r="3"/><path d="M10 18h11v-8h-3"/>',folder:'<path d="M3 6h7l2 3h9v11H3V6ZM3 9V4h7l2 2h7v3"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>'};
const ico = n => `<svg aria-hidden="true" viewBox="0 0 24 24">${paths[n] || paths.box}</svg>`;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);

// 2. Universal RPC Transport Bridge (google.script.run)
const ACTION_MAP = {
    'apiGetCurrentUser': 'users.current',
    'apiGetItems': 'items.list',
    'apiGetItemDetail': 'items.get',
    'apiCreateRequisition': 'requisitions.create',
    'apiGetRequisitions': 'requisitions.list',
    'apiConfirmReceipt': 'requisitions.receive',
    'apiCancelRequisition': 'requisitions.cancel',
    'apiResolveQr': 'qr.resolve'
};

class ApiServiceCore {
    constructor() {
        this.isGas = typeof google !== 'undefined' && typeof google.script !== 'undefined' && typeof google.script.run !== 'undefined';
        this.timeoutMs = 30000;
    }
    generateRequestId() {
        return `REQ-${Date.now().toString(36)}-${Math.random().toString(36).substring(2, 7).toUpperCase()}`;
    }
    call(fnName, ...args) {
        const reqId = this.generateRequestId();
        return new Promise((resolve, reject) => {
            if (this.isGas) {
                let isCompleted = false;
                const timer = setTimeout(() => {
                    if (!isCompleted) {
                        isCompleted = true;
                        clearTimeout(timer);
                        const err = new Error(`Timeout: Backend function [${fnName}] timed out after ${this.timeoutMs}ms (${reqId})`);
                        err.code = 'TIMEOUT';
                        err.isTimeout = true;
                        err.outcome = 'UNKNOWN_OUTCOME';
                        reject(err);
                    }
                }, this.timeoutMs);

                const onSuccess = (response) => {
                    if (!isCompleted) {
                        isCompleted = true;
                        clearTimeout(timer);
                        if (response && response.success === false) {
                            const err = new Error(response.message || response.error || `Action [${fnName}] rejected by server.`);
                            err.code = response.code || 'API_REJECTED';
                            err.response = response;
                            err.requestId = response.requestId || reqId;
                            err.isBusinessError = true;
                            reject(err);
                        } else {
                            resolve(response);
                        }
                    }
                };

                const onFailure = (error) => {
                    if (!isCompleted) {
                        isCompleted = true;
                        clearTimeout(timer);
                        reject(error);
                    }
                };

                try {
                    const runner = google.script.run
                        .withSuccessHandler(onSuccess)
                        .withFailureHandler(onFailure);

                    if (typeof runner[fnName] === 'function') {
                        runner[fnName](...args);
                    } else if (typeof runner.HRT_rpc === 'function') {
                        const action = ACTION_MAP[fnName] || fnName;
                        runner.HRT_rpc(action, args[0]);
                    } else if (typeof runner.apiCall === 'function') {
                        const action = ACTION_MAP[fnName] || fnName;
                        runner.apiCall(action, args[0]);
                    } else {
                        throw new Error(`RPC_CONTRACT_MISMATCH: Function "${fnName}" is not exported on backend bridge.`);
                    }
                } catch (transportErr) {
                    if (!isCompleted) {
                        isCompleted = true;
                        clearTimeout(timer);
                        reject(transportErr);
                    }
                }
            } else {
                const err = new Error('BACKEND_UNAVAILABLE: Google Apps Script bridge is not detected. Please open via authorized Web App URL.');
                err.code = 'BACKEND_UNAVAILABLE';
                reject(err);
            }
        });
    }
}

// Scoped Draft Persistence (MINI-10)
const DRAFT_KEY_PREFIX = 'hrt_mini_draft_';

function getDraftStorageKey() {
    const env = (typeof location !== 'undefined' && location.hostname && location.hostname.includes('script.google.com')) ? 'gas' : 'local';
    const userId = (state.user && (state.user.id || state.user.email)) ? String(state.user.id || state.user.email).replace(/[^a-zA-Z0-9_-]/g, '_') : 'guest';
    const fy = state.fiscalYear || '2569';
    return `${DRAFT_KEY_PREFIX}${env}_${userId}_${fy}`;
}

function cleanLegacyStorage() {
    try {
        const legacyKey = ['hrt', 'miniui', 'demo', 'v1'].join('-');
        localStorage.removeItem(legacyKey);
        localStorage.removeItem('hrt_cart_draft');
    } catch (e) {}
}

function saveDraft() {
    if (!state.user || state.authStatus !== 'AUTHENTICATED') return;
    try {
        const key = getDraftStorageKey();
        const data = {
            cart: state.cart,
            purpose: state.purpose,
            needDate: state.needDate,
            urgency: state.urgency,
            idempotencyKey: state.currentDraftIdempotencyKey || null,
            updatedAt: new Date().toISOString()
        };
        localStorage.setItem(key, JSON.stringify(data));
    } catch (e) {
        console.warn('Failed to save draft:', e);
    }
}

function loadDraft() {
    if (!state.user || state.authStatus !== 'AUTHENTICATED') return;
    cleanLegacyStorage();
    try {
        const key = getDraftStorageKey();
        const raw = localStorage.getItem(key);
        if (raw) {
            const data = JSON.parse(raw);
            if (data && typeof data === 'object') {
                if (data.cart && typeof data.cart === 'object') {
                    const cleanCart = {};
                    for (const [k, v] of Object.entries(data.cart)) {
                        const n = Number(v);
                        if (Number.isInteger(n) && n > 0) {
                            cleanCart[k] = n;
                        }
                    }
                    state.cart = cleanCart;
                }
                if (data.purpose && typeof data.purpose === 'string') state.purpose = data.purpose;
                if (data.needDate && typeof data.needDate === 'string') state.needDate = data.needDate;
                if (data.urgency && typeof data.urgency === 'string') state.urgency = data.urgency;
                if (data.idempotencyKey && typeof data.idempotencyKey === 'string') state.currentDraftIdempotencyKey = data.idempotencyKey;
            }
        }
    } catch (e) {
        console.warn('Failed to load draft:', e);
    }
}

function clearDraft() {
    try {
        const key = getDraftStorageKey();
        localStorage.removeItem(key);
    } catch (e) {}
    cleanLegacyStorage();
    state.currentDraftIdempotencyKey = null;
}

// 11. Event Binding & Actions
function bindEvents() {
    // Navigation buttons
    document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.onclick = () => nav(btn.dataset.nav);
    });

    // Scanner
    const scanBtn = $('#openScannerBtn');
    if (scanBtn) scanBtn.onclick = openScannerModal;

    // Search
    const searchInput = $('#catalogSearchInput');
    if (searchInput) {
        searchInput.oninput = e => {
            state.search = e.target.value;
            render();
            const reFocus = $('#catalogSearchInput');
            if (reFocus) {
                reFocus.focus();
                reFocus.setSelectionRange(state.search.length, state.search.length);
            }
        };
    }

    // Category chips
    document.querySelectorAll('[data-cat]').forEach(chip => {
        chip.onclick = () => {
            state.category = chip.dataset.cat;
            render();
        };
    });

    // Warehouse select
    const whSel = $('#warehouseSelect');
    if (whSel) {
        whSel.onchange = e => {
            state.warehouse = e.target.value;
            render();
        };
    }

    // Product cards (Click to open modal)
    document.querySelectorAll('[data-product]').forEach(btn => {
        btn.onclick = () => openProductModal(btn.dataset.product);
    });

    // Cart +/- controls (MINI-01, MINI-03)
    document.querySelectorAll('[data-cart-inc]').forEach(btn => {
        btn.onclick = () => {
            const code = btn.dataset.cartInc;
            const cur = Number(state.cart[code]) || 0;
            state.cart[code] = cur + 1;
            saveDraft();
            render();
        };
    });
    document.querySelectorAll('[data-cart-dec]').forEach(btn => {
        btn.onclick = () => {
            const code = btn.dataset.cartDec;
            const cur = Number(state.cart[code]) || 0;
            if (cur > 1) state.cart[code] = cur - 1;
            else delete state.cart[code];
            saveDraft();
            render();
        };
    });
    document.querySelectorAll('[data-cart-del]').forEach(btn => {
        btn.onclick = () => {
            delete state.cart[btn.dataset.cartDel];
            saveDraft();
            render();
        };
    });

    // Form change listeners for draft auto-save
    const purposeEl = $('#reqPurpose');
    if (purposeEl) {
        purposeEl.oninput = (e) => {
            state.purpose = e.target.value;
            saveDraft();
        };
    }
    const needDateEl = $('#reqNeedDate');
    if (needDateEl) {
        needDateEl.onchange = (e) => {
            state.needDate = e.target.value;
            saveDraft();
        };
    }
    const urgencyEl = $('#reqUrgency');
    if (urgencyEl) {
        urgencyEl.onchange = (e) => {
            state.urgency = e.target.value;
            saveDraft();
        };
    }

    // Submit Cart Button
    const btnSubmitCart = $('#btnSubmitCart');
    if (btnSubmitCart) {
        btnSubmitCart.onclick = submitRequisition;
    }

    // Request filter chips
    document.querySelectorAll('[data-reqfilter]').forEach(btn => {
        btn.onclick = () => {
            state.requestFilter = btn.dataset.reqfilter;
            render();
        };
    });

    // Request card click
    document.querySelectorAll('.reqcard').forEach(card => {
        card.onclick = (e) => {
            if (e.target.closest('[data-confirm-receipt]')) return;
            openRequestModal(card.dataset.reqId);
        };
    });

    // Confirm receipt buttons
    document.querySelectorAll('[data-confirm-receipt]').forEach(btn => {
        btn.onclick = (e) => {
            e.stopPropagation();
            confirmReceipt(btn.dataset.confirmReceipt);
        };
    });
}

// 12. Modal System
function openModal(title, bodyHtml, actionsHtml) {
    const d = $('#dialog');
    if (!d) return;
    d.innerHTML = `
        <div class="overlay" onclick="closeModal(event)">
            <div class="modal" onclick="event.stopPropagation()">
                <div class="modalhead">
                    <h3 style="margin:0">${esc(title)}</h3>
                    <button type="button" class="closebtn" onclick="closeModal()">✕</button>
                </div>
                <div class="modalbody">${bodyHtml}</div>
                ${actionsHtml ? `<div class="modalfoot">${actionsHtml}</div>` : ''}
            </div>
        </div>
    `;
}

function closeModal(e) {
    if (e && e.target && !e.target.classList.contains('overlay') && !e.target.classList.contains('closebtn')) return;
    stopCameraStream();
    const d = $('#dialog');
    if (d) d.innerHTML = '';
}

// 15. Real Camera Scanner & QR Lifecycle (MINI-04, MINI-05, MINI-09, MINI-11)
let activeScannerStream = null;
let activeScanAnimationId = null;

function stopCameraStream() {
    if (activeScanAnimationId) {
        cancelAnimationFrame(activeScanAnimationId);
        activeScanAnimationId = null;
    }
    if (activeScannerStream) {
        try {
            activeScannerStream.getTracks().forEach(track => track.stop());
        } catch (e) {
            console.warn('Error stopping camera track:', e);
        }
        activeScannerStream = null;
    }
    const video = $('#cameraVideo');
    if (video) {
        video.srcObject = null;
    }
}

async function startCameraStream() {
    const video = $('#cameraVideo');
    const statusMsg = $('#scannerStatus');
    if (!video) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (statusMsg) {
            statusMsg.innerHTML = '<span style="color:#ef4444">อุปกรณ์นี้ไม่รองรับการเข้าถึงกล้องผ่านเบราว์เซอร์ กรุณาค้นหาด้วยรหัสพัสดุด้านล่าง</span>';
        }
        return;
    }

    try {
        const constraints = {
            video: {
                facingMode: { ideal: 'environment' },
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        activeScannerStream = stream;
        video.srcObject = stream;
        await video.play();

        if (statusMsg) {
            statusMsg.innerHTML = '<span style="color:#22c55e">● ส่องกล้องไปที่ QR Code พัสดุ หรือ QR ห้อง/คลัง</span>';
        }

        if ('BarcodeDetector' in window) {
            const barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
            const detectFrame = async () => {
                if (!activeScannerStream) return;
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes && barcodes.length > 0) {
                        const rawVal = barcodes[0].rawValue;
                        if (rawVal) {
                            stopCameraStream();
                            resolveQrCode(rawVal);
                            return;
                        }
                    }
                } catch (detErr) {
                    // Ignore dropped frame
                }
                activeScanAnimationId = requestAnimationFrame(detectFrame);
            };
            activeScanAnimationId = requestAnimationFrame(detectFrame);
        } else {
            if (statusMsg) {
                statusMsg.innerHTML = '<span style="color:#60a5fa">กล้องเปิดอยู่ (หากกล้องไม่จับภาพอัตโนมัติ ให้ป้อนรหัสพัสดุด้านล่าง)</span>';
            }
        }
    } catch (err) {
        console.warn('Camera stream error:', err);
        let errorMsg = 'ไม่สามารถเข้าถึงกล้องได้: ' + (err.message || 'Permission denied');
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            errorMsg = 'กรุณาอนุญาตการเข้าถึงกล้อง (Permission Denied) ในการตั้งค่า หรือใช้การค้นหาด้วยรหัสแทน';
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
            errorMsg = 'ไม่พบอุปกรณ์กล้องบนเครื่องนี้ กรุณาใช้การค้นหาด้วยรหัสพัสดุด้านล่าง';
        }
        if (statusMsg) {
            statusMsg.innerHTML = `<span style="color:#ef4444">${esc(errorMsg)}</span>`;
        }
    }
}

        <div id="scannerStatus" style="font-size:12px;text-align:center;margin:8px 0;min-height:20px;color:#94a3b8">
            กำลังเชื่อมต่อกล้อง...
        </div>
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
            <label class="label" for="manualQrCode">ค้นหาด้วยรหัสพัสดุโดยตรง (Manual Search)</label>
            <div style="display:flex;gap:8px">
                <input id="manualQrCode" class="field" placeholder="เช่น OFF-001 หรือ ITEM:OFF-001" autocomplete="off" style="flex:1">
                <button type="button" class="btn primary" id="btnManualSearchSubmit" style="flex-shrink:0">
                    ${ico('search')}
                    <span>ค้นหา</span>
                </button>
            </div>
        </div>
    `;

    const actions = `
        <button type="button" class="btn" onclick="closeModal()" style="width:100%">
            <span>ปิดหน้าต่าง</span>
        </button>
    `;

    openModal('สแกน QR Code หรือค้นหารหัสพัสดุ', body, actions);

    startCameraStream();

    const btnManual = $('#btnManualSearchSubmit');
    if (btnManual) {
        btnManual.onclick = () => {
            const val = ($('#manualQrCode').value || '').trim();
            handleManualItemSearch(val);
        };
    }

    const inpManual = $('#manualQrCode');
    if (inpManual) {
        inpManual.onkeydown = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleManualItemSearch(inpManual.value);
            }
        };
    }
}

// Dedicated Manual Search (Strictly labeled and separate from QR resolver)
function handleManualItemSearch(inputCode) {
    if (!inputCode || typeof inputCode !== 'string' || !inputCode.trim()) {
        toast('กรุณาระบุรหัสพัสดุที่ต้องการค้นหา', 'warn');
        return;
    }
    const raw = inputCode.trim();
    const cleanCode = raw.replace(/^(QR:)?(ITEM:)/i, '').trim().toUpperCase();

    const it = state.items.find(i => String(i.code).toUpperCase() === cleanCode || String(i.fsn_code || '').toUpperCase() === cleanCode);
    if (it) {
        closeModal();
        openProductModal(it.code);
        toast(`[ค้นหาด้วยรหัส] พบพัสดุ: ${it.name} (${it.code})`, 'info');
    } else {
        toast(`[ค้นหาด้วยรหัส] ไม่พบพัสดุสำหรับรหัส "${raw}"`, 'warn');
    }
}

// Server-authoritative QR Code Resolution (No silent local fallback)
async function resolveQrCode(qrData) {
    if (!qrData || typeof qrData !== 'string' || !qrData.trim()) {
        toast('กรุณาระบุรหัส QR Code ที่ถูกต้อง', 'warn');
        return;
    }
    const token = qrData.trim();
    try {
        toast('กำลังตรวจสอบรหัส QR กับเซิร์ฟเวอร์...', 'info');
        const res = await window.ApiService.call('apiResolveQr', { qr_data: token });
        if (res && res.success) {
            closeModal();
            if (res.type === 'ITEM' && res.item) {
                openProductModal(res.item.code);
                toast(`พบพัสดุ: ${res.item.name} (${res.item.code})`, 'success');
            } else if (res.type === 'WAREHOUSE' && res.warehouse) {
                state.warehouse = res.warehouse.name || res.warehouse.id || 'all';
                nav('catalog');
                toast(`เปิดคลัง/ห้อง: ${res.warehouse.name} (${res.itemCount || 0} รายการ)`, 'info');
            } else if (res.type === 'TRACKING' && (res.canonicalId || res.req_no)) {
                await loadRequests();
                openRequestModal(res.canonicalId || res.req_no);
                toast(`เปิดคำร้องขอเบิกเลขที่: ${res.req_no || res.canonicalId}`, 'info');
            } else if (res.type === 'CATALOG') {
                state.category = 'ทั้งหมด';
                state.warehouse = 'all';
                state.search = '';
                nav('catalog');
                toast('เปิดแคตตาล็อกพัสดุทั้งหมด', 'info');
            } else {
                toast(`ประมวลผล QR Code สำเร็จ: ${token}`, 'info');
            }
        } else {
            const errMsg = (res && res.message) || (res && res.error) || 'รหัส QR Code ไม่ถูกต้องหรือถูกยกเลิก';
            toast(errMsg, 'danger');
        }
    } catch (e) {
        console.warn('QR Resolution error:', e);
        const errMsg = e.message || 'รหัส QR ไม่ถูกต้อง';
        // STRICT: DO NOT fall back to local items! Show the real server error.
        toast(`ไม่สามารถใช้ QR Code ได้: ${errMsg}`, 'danger');
    }
}

// 16. Submit Requisition to Backend (MINI-01, MINI-03)
async function submitRequisition() {
    const entries = Object.entries(state.cart).filter(([code, q]) => Number.isInteger(q) && q > 0);
    if (!entries.length) { toast('กรุณาเลือกพัสดุลงในตะกร้าก่อนส่งคำขอ', 'warn'); return; }

    const purpose = ($('#reqPurpose')?.value || state.purpose || '').trim();
    if (!purpose) { toast('กรุณาระบุวัตถุประสงค์ในการขอเบิก', 'warn'); $('#reqPurpose')?.focus(); return; }

    const needDate = $('#reqNeedDate')?.value || state.needDate || '';
    const urgency = $('#reqUrgency')?.value || state.urgency || 'NORMAL';

    state.purpose = purpose;
    state.needDate = needDate;
    state.urgency = urgency;

    if (!state.currentDraftIdempotencyKey) {
        state.currentDraftIdempotencyKey = 'MINI-REQ-' + Date.now() + '-' + Math.random().toString(36).substring(2, 7).toUpperCase();
        saveDraft();
    }

    const items = entries.map(([code, qty]) => {
        const it = state.items.find(i => i.code === code) || { unit: 'ชิ้น' };
        return {
            item_code: code,
            qty: qty,
            unit: it.unit || 'ชิ้น'
        };
    });

    const payload = {
        items: items,
        purpose: purpose,
        urgency: urgency,
        required_date: needDate,
        dept: state.user ? (state.user.department || state.user.dept || 'ทั่วไป') : 'ทั่วไป',
        source: 'MINI_QR',
        idempotency_key: state.currentDraftIdempotencyKey
    };

    const btn = $('#btnSubmitCart');
    if (btn) { btn.disabled = true; btn.innerText = 'กำลังส่งคำขอ...'; }

    try {
        const res = await window.ApiService.call('apiCreateRequisition', payload);
        if (res && res.success) {
            clearDraft();
            state.cart = {};
            state.currentDraftIdempotencyKey = null;
            toast(`ส่งคำร้องขอเบิกเลขที่ ${res.req_no || res.req_id} สำเร็จแล้ว`, 'success');
            await loadRequests();
            nav('requests');
        } else {
            throw new Error(res && res.error ? (res.error.message || res.error) : (res && res.message ? res.message : 'ส่งคำขอไม่สำเร็จ'));
        }
    } catch (err) {
        console.error('Submit requisition error:', err);
        if (err.outcome === 'UNKNOWN_OUTCOME' || err.isTimeout || err.code === 'TIMEOUT') {
            toast('การเชื่อมต่อหมดเวลา (Timeout) ตะกร้าถูกเก็บรักษาไว้ กรุณาตรวจสอบใน "คำร้องของฉัน" หรือกดส่งอีกครั้ง', 'warn');
        } else {
            toast(`เกิดข้อผิดพลาด: ${err.message}`, 'danger');
        }
    } finally {
        if (btn) { btn.disabled = false; btn.innerText = 'ยืนยันส่งคำร้องขอเบิก'; }
    }
}

// 17. Confirm Receipt (MINI-06)
async function confirmReceipt(reqId) {
    if (!reqId) return;
    const r = state.requests.find(x => (x.req_id || x.id) === reqId);
    if (r && String(r.status || '').toUpperCase() !== 'ISSUED') {
        toast('สามารถยืนยันรับของได้เฉพาะคำร้องที่มีสถานะ "จ่ายพัสดุแล้ว (ISSUED)" เท่านั้น', 'warn');
        return;
    }

    if (!confirm('ยืนยันว่าได้รับพัสดุครบถ้วนตามรายการแล้วหรือไม่?')) return;
    try {
        toast('กำลังบันทึกการรับของ...', 'info');
        const res = await window.ApiService.call('apiConfirmReceipt', { requisition_id: reqId });
        if (res && res.success) {
            toast('ยืนยันรับพัสดุเรียบร้อยแล้ว', 'success');
            await loadRequests();
            render();
        } else {
            throw new Error(res && res.error ? (res.error.message || res.error) : (res && res.message ? res.message : 'ไม่สามารถบันทึกได้'));
        }
    } catch (e) {
        toast(`ผิดพลาด: ${e.message}`, 'danger');
    }
}

// 18. Cancel Requisition
async function cancelRequisition(reqId) {
    if (!confirm('ต้องการยกเลิกคำร้องขอเบิกนี้หรือไม่?')) return;
    try {
        toast('กำลังยกเลิกคำร้อง...', 'info');
        const res = await window.ApiService.call('apiCancelRequisition', { requisition_id: reqId });
        if (res && res.success) {
            closeModal();
            toast('ยกเลิกคำร้องเรียบร้อยแล้ว', 'info');
            await loadRequests();
            render();
        } else {
            throw new Error(res && res.error ? res.error.message : 'ไม่สามารถยกเลิกได้');
        }
    } catch (e) {
        toast(`ผิดพลาด: ${e.message}`, 'danger');
    }
}

// 19. Data Loaders
async function loadCatalog() {
    state.isLoadingItems = true;
    render();
    try {
        const res = await window.ApiService.call('apiGetItems');
        if (res && res.items) {
            state.items = res.items;
        } else if (Array.isArray(res)) {
            state.items = res;
        }
    } catch (e) {
        console.warn('Load catalog fallback:', e);
    } finally {
        state.isLoadingItems = false;
        render();
    }
}

async function loadRequests() {
    state.isLoadingRequests = true;
    try {
        const res = await window.ApiService.call('apiGetRequisitions', { user_id: state.user ? state.user.id : null });
        if (res && res.requisitions) {
            state.requests = res.requisitions;
        } else if (Array.isArray(res)) {
            state.requests = res;
        }
    } catch (e) {
        console.warn('Load requests error:', e);
    } finally {
        state.isLoadingRequests = false;
    }
}

// 20. Authentication Lifecycle (MINI-07)
function signInWithGoogle() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
        window.location.reload();
    } else {
        toast('กรุณาเปิดผ่าน Google Web App URL เพื่อเข้าสู่ระบบ', 'info');
    }
}

function sanitizeInternalRoute(route) {
    if (!route || typeof route !== 'string') return '';
    const trimmed = route.trim();
    if (/^(https?:|\/\/|javascript:|data:)/i.test(trimmed)) return '';
    if (/^(\?view=(mini|main)|#([a-zA-Z0-9_-]+))$/i.test(trimmed)) return trimmed;
    return '';
}

function signOut() {
    stopCameraStream();
    clearDraft();
    state.authStatus = 'SIGNED_OUT';
    state.user = null;
    state.cart = {};
    state.requests = [];
    state.items = [];
    try { sessionStorage.clear(); } catch(e) {}
    render();
    toast('ออกจากระบบ HRT Inventory เรียบร้อยแล้ว (สิ้นสุด Session)', 'info');
}

async function initApp() {
    state.authStatus = 'CHECKING';
    render();

    try {
        const res = await window.ApiService.call('apiGetCurrentUser');
        const user = (res && res.user) ? res.user : (res && res.email ? res : null);

        if (user && user.email) {
            if (user.status === 'SUSPENDED' || user.isActive === false || user.isPendingApproval) {
                state.authStatus = 'ACCESS_DENIED';
                state.user = user;
                clearDraft();
                render();
                return;
            }

            state.authStatus = 'AUTHENTICATED';
            state.user = user;
            loadDraft();
            render();

            // Load data in parallel
            await Promise.all([
                loadCatalog(),
                loadRequests()
            ]);
            render();
        } else {
            state.authStatus = 'UNAUTHENTICATED';
            render();
        }
    } catch (err) {
        console.warn('Init auth check error:', err);
        state.authStatus = 'UNAUTHENTICATED';
        render();
    }
}

// Start application
window.onload = initApp;
window.onbeforeunload = () => { stopCameraStream(); };
window.onpagehide = () => { stopCameraStream(); };

</script>
